<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070b14"/></linearGradient>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
<style>
text{font-family:'Courier New',Consolas,monospace}
.g{font-size:15px;fill:#4ade80}.v{font-size:14px;fill:#e2e8f0}.k{font-size:15px;font-weight:700}
.ti{font-size:12px;fill:#64748b;text-anchor:middle}
.ln{animation:fi .7s ease-out both}@keyframes fi{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
</style>
<rect width="900" height="320" rx="20" fill="url(#bg)"/>
<path d="M0 20a20 20 0 0120-20h860a20 20 0 0120 20v22H0z" fill="#111a2e"/>
<circle cx="28" cy="21" r="6" fill="#ef4444"/><circle cx="50" cy="21" r="6" fill="#facc15"/><circle cx="72" cy="21" r="6" fill="#22c55e"/>
<text class="ti" x="450" y="26">ivan@portfolio: ~/ahora</text>
<g class="ln" style="animation-delay:.2s"><text class="g" x="30" y="85">$ cat estado.txt</text></g>
<g class="ln" style="animation-delay:0.7s"><text class="k" x="30" y="140" fill="#60a5fa">cursando</text><text class="v" x="190" y="140">DAW · IES Abastos</text><rect x="630" y="128" width="240" height="12" rx="6" fill="#1e293b"/><rect x="630" y="128" width="40" height="12" rx="6" fill="#60a5fa"><animate attributeName="width" values="40;240;40" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect></g>
<g class="ln" style="animation-delay:1.2s"><text class="k" x="30" y="192" fill="#a78bfa">aprendiendo</text><text class="v" x="190" y="192">Laravel · Vue 3 · Docker · Three.js</text><rect x="630" y="180" width="240" height="12" rx="6" fill="#1e293b"/><rect x="630" y="180" width="40" height="12" rx="6" fill="#a78bfa"><animate attributeName="width" values="40;240;40" dur="5.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect></g>
<g class="ln" style="animation-delay:1.7s"><text class="k" x="30" y="244" fill="#f472b6">construyendo</text><text class="v" x="190" y="244">Proyectos full stack para mi portfolio</text><rect x="630" y="232" width="240" height="12" rx="6" fill="#1e293b"/><rect x="630" y="232" width="40" height="12" rx="6" fill="#f472b6"><animate attributeName="width" values="40;240;40" dur="6.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect></g>
<g class="ln" style="animation-delay:2.4s"><text class="g" x="30" y="295">$ <tspan class="cur" fill="#e2e8f0">▍</tspan></text></g>
</svg>