<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#070b14"/></linearGradient>
<linearGradient id="ax" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif}
.t{font-size:14px;font-weight:700;fill:#f1f5f9}
.s{font-size:12px;font-weight:600}
.d{font-size:11.5px;fill:#94a3b8}
.c{font-size:12px;font-weight:700;text-anchor:middle;fill:#0b1220}
.lg{font-size:12px;letter-spacing:2px;fill:#94a3b8}
.L{animation:inL .9s ease-out both} .R{animation:inR .9s ease-out both}
@keyframes inL{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.p{animation:pl 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
</style>
<rect width="900" height="640" rx="20" fill="url(#bg)"/>
<circle cx="300" cy="32" r="5" fill="#60a5fa"/><text class="lg" x="312" y="36">FORMACIÓN</text>
<circle cx="520" cy="32" r="5" fill="#f472b6"/><text class="lg" x="532" y="36">EXPERIENCIA</text>
<rect x="448.5" y="70" width="3" height="530" rx="1.5" fill="url(#ax)" opacity=".55"/>
<g class="L" style="animation-delay:0.15s"><line x1="410" y1="110" x2="450" y2="110" stroke="#60a5fa" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="50" y="72" width="360" height="76" rx="14" fill="#111a2e" stroke="#60a5fa" stroke-opacity=".35"/><rect x="50" y="72" width="5" height="76" rx="2.5" fill="#60a5fa" transform="translate(0 0)"/><text class="t" x="72" y="101">DAW · Desarrollo de Aplicaciones Web</text><text class="s" x="72" y="119" fill="#60a5fa">Técnico Superior · IES Abastos</text><text class="d" x="72" y="136">Frontend, backend, bases de datos y despliegue.</text><rect x="480" y="97" width="140" height="26" rx="13" fill="#60a5fa"/><text class="c" x="550" y="115">2025 – Actualidad</text><circle cx="450" cy="110" r="8" fill="#0b1220" stroke="#60a5fa" stroke-width="3"/><circle class="p" cx="450" cy="110" r="8" fill="none" stroke="#60a5fa" stroke-width="2"/></g>
<g class="R" style="animation-delay:0.50s"><line x1="490" y1="222" x2="450" y2="222" stroke="#f472b6" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="490" y="184" width="360" height="76" rx="14" fill="#111a2e" stroke="#f472b6" stroke-opacity=".35"/><rect x="490" y="184" width="5" height="76" rx="2.5" fill="#f472b6"/><text class="t" x="512" y="213">Desarrollador Web Full Stack</text><text class="s" x="512" y="231" fill="#f472b6">Freelance</text><text class="d" x="512" y="248">Webs y apps a medida: JavaScript, Node, WordPress.</text><rect x="290" y="209" width="140" height="26" rx="13" fill="#f472b6"/><text class="c" x="360" y="227">2024 – Actualidad</text><circle cx="450" cy="222" r="8" fill="#0b1220" stroke="#f472b6" stroke-width="3"/><circle class="p" cx="450" cy="222" r="8" fill="none" stroke="#f472b6" stroke-width="2"/></g>
<g class="L" style="animation-delay:0.85s"><line x1="410" y1="334" x2="450" y2="334" stroke="#60a5fa" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="50" y="296" width="360" height="76" rx="14" fill="#111a2e" stroke="#60a5fa" stroke-opacity=".35"/><rect x="50" y="296" width="5" height="76" rx="2.5" fill="#60a5fa" transform="translate(0 0)"/><text class="t" x="72" y="325">DAM · Aplicaciones Multiplataforma</text><text class="s" x="72" y="343" fill="#60a5fa">Técnico Superior · AulaCampus</text><text class="d" x="72" y="360">Programación, bases de datos y apps multiplataforma.</text><rect x="480" y="321" width="140" height="26" rx="13" fill="#60a5fa"/><text class="c" x="550" y="339">2023 – 2025</text><circle cx="450" cy="334" r="8" fill="#0b1220" stroke="#60a5fa" stroke-width="3"/></g>
<g class="R" style="animation-delay:1.20s"><line x1="490" y1="446" x2="450" y2="446" stroke="#60a5fa" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="490" y="408" width="360" height="76" rx="14" fill="#111a2e" stroke="#60a5fa" stroke-opacity=".35"/><rect x="490" y="408" width="5" height="76" rx="2.5" fill="#60a5fa"/><text class="t" x="512" y="437">SMR · Sistemas Microinformáticos y Redes</text><text class="s" x="512" y="455" fill="#60a5fa">Grado Medio · AulaCampus</text><text class="d" x="512" y="472">Equipos, redes, sistemas operativos y aplicaciones.</text><rect x="290" y="433" width="140" height="26" rx="13" fill="#60a5fa"/><text class="c" x="360" y="451">2021 – 2023</text><circle cx="450" cy="446" r="8" fill="#0b1220" stroke="#60a5fa" stroke-width="3"/></g>
<g class="L" style="animation-delay:1.55s"><line x1="410" y1="558" x2="450" y2="558" stroke="#60a5fa" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="50" y="520" width="360" height="76" rx="14" fill="#111a2e" stroke="#60a5fa" stroke-opacity=".35"/><rect x="50" y="520" width="5" height="76" rx="2.5" fill="#60a5fa" transform="translate(0 0)"/><text class="t" x="72" y="549">ESO · Educación Secundaria</text><text class="s" x="72" y="567" fill="#60a5fa">Dominicas Paterna</text><text class="d" x="72" y="584">Formación secundaria obligatoria.</text><rect x="480" y="545" width="140" height="26" rx="13" fill="#60a5fa"/><text class="c" x="550" y="563">2017 – 2021</text><circle cx="450" cy="558" r="8" fill="#0b1220" stroke="#60a5fa" stroke-width="3"/></g>
<circle r="14" fill="url(#gl)"><animate attributeName="cx" values="450;450" dur="1s" repeatCount="indefinite"/><animate attributeName="cy" values="70;600;70" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".4 0 .6 1;.4 0 .6 1"/></circle>
</svg>